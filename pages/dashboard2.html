<div class="row g-2 g-md-3 justify-content-center dashboard-page">

    <div class="col-lg-12">
        <div class="position-relative cozy-hero">
            <img src="assets/img/cozy-welcome.jpg" alt="" class="img-fluid rounded-4">

            <div class="position-absolute bottom-0 start-0 w-100 p-3 p-md-4 overlay-box">
                <h3 class="fw-bold mb-2">Welcome, Stranger!</h3>
                <p class="mb-0 small d-none d-md-block"><i class="bi bi-play-circle me-1"></i> This is your cozy
                    space where you can manage your tasks and enjoy music at the same time.</p>

                <p class="mb-0 small d-md-none"><i class="bi bi-play-circle me-1"></i> Manage and enjoy music at the
                    same time.</p>
            </div>
        </div>
    </div>

    <div class="col-lg-12">
        <div class="card cozy-card rounded-4 shadow-sm border-0">
            <div class="p-4">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h5 class="mb-1">My Tasks</h5>
                        <small class="text-muted">Project workflow</small>
                    </div>

                    <button class="btn btn-sm btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>
                        Add Task
                    </button>
                </div>

                <div class="row g-3">

                    <div class="col-4">
                        <div class="card border-0 shadow-sm h-100">

                            <div class="card-header bg-transparent border-0 pt-3 pb-2">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <span class="fw-semibold">To Do</span>
                                        <span id="todoCount" class="badge bg-secondary-subtle text-secondary ms-1">
                                            1
                                        </span>
                                    </div>

                                    <button class="btn btn-sm btn-light">
                                        <i class="bi bi-three-dots"></i>
                                    </button>
                                </div>
                            </div>

                            <div id="todoColumn" class="card-body pt-1 d-flex flex-column gap-2">

                                <div class="card border shadow-sm">
                                    <div class="card-body p-3">

                                        <div class="d-flex justify-content-between align-items-start">
                                            <h6 class="mb-2">Website Backup</h6>

                                            <button class="btn btn-sm btn-light p-1">
                                                <i class="bi bi-three-dots"></i>
                                            </button>
                                        </div>

                                        <span class="badge bg-primary-subtle text-primary">
                                            Website
                                        </span>

                                    </div>
                                </div>

                                <button class="btn btn-light text-start text-muted border-0">
                                    <i class="bi bi-plus-lg me-1"></i>
                                    Add a card
                                </button>

                            </div>
                        </div>
                    </div>


                    <div class="col-4">
                        <div class="card border-0 shadow-sm h-100">

                            <div class="card-header bg-transparent border-0 pt-3 pb-2">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <span class="fw-semibold">In Progress</span>
                                        <span id="progressCount" class="badge bg-primary-subtle text-primary ms-1">
                                            0
                                        </span>
                                    </div>

                                    <button class="btn btn-sm btn-light">
                                        <i class="bi bi-three-dots"></i>
                                    </button>
                                </div>
                            </div>

                            <div id="progressColumn" class="card-body pt-1 d-flex flex-column gap-2">

                                <button class="btn btn-light text-start text-muted border-0">
                                    <i class="bi bi-plus-lg me-1"></i>
                                    Add a card
                                </button>

                            </div>
                        </div>
                    </div>


                    <div class="col-4">
                        <div class="card border-0 shadow-sm h-100">

                            <div class="card-header bg-transparent border-0 pt-3 pb-2">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <span class="fw-semibold">Done</span>
                                        <span id="doneCount" class="badge bg-success-subtle text-success ms-1">
                                            0
                                        </span>
                                    </div>

                                    <button class="btn btn-sm btn-light">
                                        <i class="bi bi-three-dots"></i>
                                    </button>
                                </div>
                            </div>

                            <div id="doneColumn" class="card-body pt-1 d-flex flex-column gap-2">

                                <button class="btn btn-light text-start text-muted border-0">
                                    <i class="bi bi-plus-lg me-1"></i>
                                    Add a card
                                </button>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>


</div>
